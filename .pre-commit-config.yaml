# Install: pip install pre-commit && pre-commit install (once per clone)
# Runs on every `git commit`, before the commit exists - a secret never leaves
# the machine, unlike gitleaks in CI (which only catches it once it is already
# on GitHub). terraform_fmt is free to add: it is instant and avoids the CI
# fmt-check bouncing the PR over indentation.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
